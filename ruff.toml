# Python lint for tools/ (analyser, sample FIT writer, tests). Run: ruff check
target-version = "py310"
line-length = 140
extend-exclude = ["docs"]

[lint]
select = ["E", "W", "F", "I", "B"]
# E501: the HTML/JS report templates are long string literals. B905: zip(strict=) is not needed here.
ignore = ["E501", "B905"]

[lint.isort]
known-first-party = ["mtbdyn", "mtb_analyze", "make_sample_fit"]
